{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 m-0">{{ "Новый сотрудник" if not employee else "Редактирование сотрудника" }}</h1>
  <a href="/staff" class="btn btn-outline-secondary">К списку</a>
</div>

<form method="post" action="{{ '/staff/' ~ employee.id if employee else '/staff' }}" class="card card-body">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <div class="row g-3">
    <div class="col-12 col-md-6">
      <label class="form-label" for="last_name">Фамилия</label>
      <input class="form-control" id="last_name" name="last_name" value="{{ employee.last_name if employee else '' }}" required>
    </div>
    <div class="col-12 col-md-6">
      <label class="form-label" for="first_name">Имя</label>
      <input class="form-control" id="first_name" name="first_name" value="{{ employee.first_name if employee else '' }}" required>
    </div>
    <div class="col-12 col-md-6">
      <label class="form-label" for="position">Должность</label>
      <input class="form-control" id="position" name="position" value="{{ employee.position or '' if employee else '' }}">
    </div>
    <div class="col-12 col-md-6">
      <label class="form-label" for="department_id">Отдел</label>
      <select class="form-select" id="department_id" name="department_id">
        <option value="">Без отдела</option>
        {% for d in departments %}
          <option value="{{ d.id }}" {% if employee and employee.department_id == d.id %}selected{% endif %}>{{ d.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-12 col-md-6">
      <label class="form-label" for="phone">Телефон</label>
      <input class="form-control" id="phone" name="phone" value="{{ employee.phone or '' if employee else '' }}">
    </div>
    <div class="col-12 col-md-6">
      <label class="form-label" for="email">Email</label>
      <input class="form-control" id="email" name="email" type="email" value="{{ employee.email or '' if employee else '' }}">
    </div>
    <div class="col-12 col-md-6">
      <label class="form-label" for="user_id">Учётная запись в системе</label>
      <select class="form-select" id="user_id" name="user_id">
        <option value="">Без учётной записи</option>
        {% for u in users %}
          <option value="{{ u.id }}" {% if employee and employee.user_id == u.id %}selected{% endif %}>{{ u.username }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-12 col-md-6 d-flex align-items-end">
      <div class="form-check">
        <input class="form-check-input" type="checkbox" id="is_active" name="is_active" value="1"
               {% if not employee or employee.is_active %}checked{% endif %}>
        <label class="form-check-label" for="is_active">Активен</label>
      </div>
    </div>
    <div class="col-12">
      <label class="form-label" for="comment">Комментарий</label>
      <textarea class="form-control" id="comment" name="comment" rows="2">{{ employee.comment or '' if employee else '' }}</textarea>
    </div>
  </div>
  <div class="mt-3">
    <button class="btn btn-primary" type="submit">Сохранить</button>
    <a href="/staff" class="btn btn-outline-secondary">Отмена</a>
  </div>
</form>
{% endblock %}
