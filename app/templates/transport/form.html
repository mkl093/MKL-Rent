{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 m-0">{{ "Новая машина" if not vehicle else "Редактирование машины" }}</h1>
  <a href="/transport" class="btn btn-outline-secondary">К списку</a>
</div>

<form method="post" action="{{ '/transport/' ~ vehicle.id if vehicle else '/transport' }}" class="card card-body">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <div class="row g-3">
    <div class="col-12 col-md-6">
      <label class="form-label" for="name">Название</label>
      <input class="form-control" id="name" name="name" value="{{ vehicle.name if vehicle else '' }}" required>
    </div>
    <div class="col-12 col-md-3">
      <label class="form-label" for="plate_number">Гос. номер</label>
      <input class="form-control" id="plate_number" name="plate_number" value="{{ vehicle.plate_number or '' if vehicle else '' }}">
    </div>
    <div class="col-12 col-md-3">
      <label class="form-label" for="max_weight_kg">Грузоподъёмность, кг</label>
      <input class="form-control" id="max_weight_kg" name="max_weight_kg" type="number" step="0.001" min="0"
             value="{{ vehicle.max_weight_kg if vehicle else '0' }}">
    </div>
    <div class="col-12">
      <label class="form-label" for="comment">Комментарий</label>
      <textarea class="form-control" id="comment" name="comment" rows="2">{{ vehicle.comment or '' if vehicle else '' }}</textarea>
    </div>
  </div>
  <div class="mt-3">
    <button class="btn btn-primary" type="submit">Сохранить</button>
    <a href="/transport" class="btn btn-outline-secondary">Отмена</a>
  </div>
</form>
{% endblock %}
